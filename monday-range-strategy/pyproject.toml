[project]
name = "monday-range"
version = "0.1.0"
description = "Monday Range + liquidity sweep strategy: data, rules engine, backtest"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "numpy>=1.26",
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monday_range"]

[tool.pytest.ini_options]
testpaths = ["tests"]
